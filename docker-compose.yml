services:
  # MongoDB Datenbank
  match-werkstatt-mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - match-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend (Node.js / Express)
  match-werkstatt-backend:
    image: ghcr.io/match-misc/match-werkstatt-backend:main
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@match-werkstatt-mongodb:27017/${MONGO_DB_NAME}?authSource=${MONGO_DB_NAME}
      DB_NAME: ${MONGO_DB_NAME}
      LDAP_HOST: ${LDAP_HOST}
      LDAP_PORT: ${LDAP_PORT}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE}
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_USER_DN_TEMPLATES: ${LDAP_USER_DN_TEMPLATES}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
    volumes:
      - uploads_data:/app/storage/uploads
      - network_data:/app/storage/network
    depends_on:
      match-werkstatt-mongodb:
        condition: service_healthy
    networks:
      - match-network

  # Frontend (nginx + React Build)
  match-werkstatt-frontend:
    image: ghcr.io/match-misc/match-werkstatt-frontend:main
    restart: unless-stopped
    ports:
      - "5007:80"
    depends_on:
      - match-werkstatt-backend
    networks:
      - match-network

  # ── Backup (MongoDB) ──────────────────────────────────────
  # Creates daily backups at BACKUP_TIME. Retains BACKUP_RETAIN_COUNT oldest backups.
  match-werkstatt-mongo-backup:
    image: mongo:7.0
    environment:
      MONGO_USER: ${MONGO_ROOT_USER}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETAIN_COUNT: ${BACKUP_RETAIN_COUNT:-7}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    networks:
      - match-network
    entrypoint: |
      sh -c '
      echo "Backup service started – daily at $${BACKUP_TIME}, retain $${BACKUP_RETAIN_COUNT}, TZ=$${TZ}"
      while true; do
        TARGET=$$(date -d "$${BACKUP_TIME}" +%s 2>/dev/null || date -d "tomorrow $${BACKUP_TIME}" +%s)
        NOW=$$(date +%s)
        WAIT=$$((TARGET - NOW))
        if [ "$${WAIT}" -le 0 ]; then
          WAIT=$$((WAIT + 86400))
        fi
        echo "Next backup in $${WAIT}s (at $${BACKUP_TIME})"
        sleep "$${WAIT}"

        STAMP=$$(date +%Y%m%d_%H%M%S)
        FILE_DB="/backups/werkstatt-backup.archive"

        echo "[$${STAMP}] Starting backups..."
        
        mongodump \
          --host=match-werkstatt-mongodb \
          --username="$${MONGO_USER}" \
          --password="$${MONGO_PASSWORD}" \
          --authenticationDatabase=admin \
          --archive="$${FILE_DB}" \
          --gzip \
        && echo "[$${STAMP}] DB Backup saved → $${FILE_DB}" \
        || echo "[$${STAMP}] ⚠ DB Backup FAILED"
      done'
    depends_on:
      match-werkstatt-mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local
  network_data:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,dir_mode=0777,file_mode=0777"
      device: "${SMB_SHARE_PATH}"

networks:
  match-network:
    driver: bridge
