services:
  # MongoDB Datenbank
  mongodb:
    image: mongo:7
    container_name: match-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - match-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend (Node.js / Express)
  backend:
    image: ghcr.io/match-misc/match-werkstatt-backend:main
    container_name: match-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=${MONGO_DB_NAME}
      DB_NAME: ${MONGO_DB_NAME}
      LDAP_HOST: ${LDAP_HOST}
      LDAP_PORT: ${LDAP_PORT}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE}
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_USER_DN_TEMPLATES: ${LDAP_USER_DN_TEMPLATES}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
    volumes:
      - uploads_data:/app/storage/uploads
      - cam_files_data:/app/storage/cam-files
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - match-network

  # Frontend (nginx + React Build)
  frontend:
    image: ghcr.io/match-misc/match-werkstatt-frontend:main
    container_name: match-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - match-network

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local
  cam_files_data:
    driver: local

networks:
  match-network:
    driver: bridge
