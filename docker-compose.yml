services:
  # MongoDB Datenbank
  mongodb:
    image: mongo:7
    container_name: match-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27017:27017"
    networks:
      - match-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend (Node.js / Express)
  backend:
    image: ghcr.io/match-misc/match-werkstatt-backend:main
    container_name: match-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=${MONGO_DB_NAME}
      DB_NAME: ${MONGO_DB_NAME}
      LDAP_HOST: ${LDAP_HOST}
      LDAP_PORT: ${LDAP_PORT}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE}
      LDAP_DOMAIN: ${LDAP_DOMAIN}
      LDAP_USER_DN_TEMPLATES: ${LDAP_USER_DN_TEMPLATES}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
    volumes:
      - uploads_data:/app/storage/uploads
      - cam_files_data:/app/storage/cam-files
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - match-network

  # Frontend (nginx + React Build)
  frontend:
    image: ghcr.io/match-misc/match-werkstatt-frontend:main
    container_name: match-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - match-network

  # ── Backup (MongoDB + Uploads/Cam Files) ──────────────────────────────────────
  # Creates daily backups at BACKUP_TIME. Retains BACKUP_RETAIN_COUNT oldest backups.
  mongo-backup:
    image: mongo:7.0
    container_name: match-mongo-backup
    environment:
      MONGO_USER: ${MONGO_ROOT_USER}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETAIN_COUNT: ${BACKUP_RETAIN_COUNT:-7}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads_data:/app/storage/uploads:ro
      - cam_files_data:/app/storage/cam-files:ro
    networks:
      - match-network
    entrypoint: |
      sh -c '
      echo "Backup service started – daily at $${BACKUP_TIME}, retain $${BACKUP_RETAIN_COUNT}, TZ=$${TZ}"
      while true; do
        TARGET=$$(date -d "$${BACKUP_TIME}" +%s 2>/dev/null || date -d "tomorrow $${BACKUP_TIME}" +%s)
        NOW=$$(date +%s)
        WAIT=$$((TARGET - NOW))
        if [ "$${WAIT}" -le 0 ]; then
          WAIT=$$((WAIT + 86400))
        fi
        echo "Next backup in $${WAIT}s (at $${BACKUP_TIME})"
        sleep "$${WAIT}"

        STAMP=$$(date +%Y%m%d_%H%M%S)
        FILE_DB="/backups/werkstatt/werkstatt-backup.archive"
        FILE_UPLOADS="/backups/werkstatt/werkstatt-backup-uploads.tar.gz"
        FILE_CAM="/backups/werkstatt/werkstatt-backup-camfiles.tar.gz"

        echo "[$${STAMP}] Starting backups..."
        mkdir -p /backups/werkstatt
        
        mongodump \
          --host=mongodb \
          --username="$${MONGO_USER}" \
          --password="$${MONGO_PASSWORD}" \
          --authenticationDatabase=admin \
          --archive="$${FILE_DB}" \
          --gzip \
        && echo "[$${STAMP}] DB Backup saved → $${FILE_DB}" \
        || echo "[$${STAMP}] ⚠ DB Backup FAILED"

        tar -czf "$${FILE_UPLOADS}" -C /app/storage/uploads . \
        && echo "[$${STAMP}] Uploads Backup saved → $${FILE_UPLOADS}" \
        || echo "[$${STAMP}] ⚠ Uploads Backup FAILED"

        tar -czf "$${FILE_CAM}" -C /app/storage/cam-files . \
        && echo "[$${STAMP}] Cam-Files Backup saved → $${FILE_CAM}" \
        || echo "[$${STAMP}] ⚠ Cam-Files Backup FAILED"
      done'
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local
  cam_files_data:
    driver: local

networks:
  match-network:
    driver: bridge
