server {
    listen 80;
    server_name _;

    # Frontend (statische Dateien aus dem Build)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip-Komprimierung
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # API-Requests an den Backend-Container weiterleiten
    location /api/ {
        proxy_pass http://match-werkstatt-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # Uploads (statische Dateien vom Backend)
    location /uploads/ {
        proxy_pass http://match-werkstatt-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Netzwerkdateien vom Backend
    location /network-files/ {
        proxy_pass http://match-werkstatt-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket-Verbindungen
    location /ws {
        proxy_pass http://match-werkstatt-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Assets (JS, CSS, Fonts, Bilder) dürfen für immer gecached werden, da Vite Hash-Namen vergibt
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2?|eot|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA-Fallback und Einstiegspunkte: Alle anderen Routen (z.B. Sub-Routes wie /dashboard) fallen hier rein.
    # Hier verbieten wir das Caching, damit die index.html bei jedem Neuladen aktuell ist.
    location / {
        try_files $uri $uri/ /index.html;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
